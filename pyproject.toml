[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "autonomous-aep"
version = "0.3.0"
description = "AEP, the Autonomous Execution Protocol: how an AI agent changes real systems so that people can trust it"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Entalinity" }]
keywords = ["ai-agents", "change-management", "protocol", "rfc8785", "dsse", "network-automation", "infrastructure"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security :: Cryptography",
  "Topic :: System :: Systems Administration",
]
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
autonomous-aep = "autonomous_aep.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autonomous_aep"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "SPEC.md", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[project.urls]
Homepage = "https://github.com/Mabhekane01/autonomous-execution-protocol"
Issues = "https://github.com/Mabhekane01/autonomous-execution-protocol/issues"
